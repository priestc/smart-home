<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Home: Amazon orders</title>
  <style>
    body { font: 13px/1.45 -apple-system, system-ui, sans-serif; width: 360px; margin: 0; padding: 12px 14px; color: #2c3e50; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #7f8c9b; margin: 14px 0 4px; }
    .muted { color: #7f8c9b; }
    .err { color: #c62828; }
    .ok { color: #2e7d32; }
    button { background: #e07820; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    button.secondary { background: #fff; color: #4a6080; border: 1px solid #d0dce8; }
    button:disabled { opacity: .5; cursor: default; }
    select { padding: 4px 6px; border: 1px solid #d0dce8; border-radius: 6px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #d0dce8; border-radius: 6px; font-size: 13px; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
    ul { margin: 0; padding-left: 16px; }
    li { margin: 3px 0; word-break: break-word; }
    a { color: #2e7dd4; }
  </style>
</head>
<body>
  <h1>Amazon orders &rarr; Smart Home</h1>
  <div class="muted">Orders are sent after you check out and when you open an order&rsquo;s page.</div>

  <div id="access" style="display:none;margin-top:10px">
    <div class="err">The extension isn&rsquo;t allowed to use amazon.com and your smart-home server yet
      (Firefox starts extensions with site access off).</div>
    <div class="row"><button id="grant">Allow access</button></div>
  </div>

  <h2>Sync</h2>
  <div class="row"><button id="sync">Sync orders</button>
    <select id="range"></select><span id="queue" class="muted"></span></div>
  <div id="sync-status" class="muted" style="margin-top:6px"></div>

  <h2>Recent</h2>
  <ul id="log"><li class="muted">Nothing sent yet.</li></ul>

  <h2>Smart Home address</h2>
  <input id="server" placeholder="http://smart-home.lan">
  <div class="row"><button class="secondary" id="save">Save</button><button class="secondary" id="test">Test connection</button>
    <span id="server-status" class="muted"></span></div>

  <script src="popup.js"></script>
</body>
</html>
